# ABOUTME: Runs the locked repository gates on real Windows and Linux runners.
# ABOUTME: Keeps PR permissions read-only and uploads only generated test diagnostics.
name: Repository quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      UV_LINK_MODE: copy
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked uv toolchain
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .python-version
          cache-suffix: py313-uv011-${{ runner.os }}
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Strict types on runner platform
        run: uv run --locked mypy
      - name: Strict Windows types
        run: uv run --locked mypy --platform win32
      - name: Strict Linux types
        run: uv run --locked mypy --platform linux
      - name: Tutor contract
        run: uv run --locked practice tutor check
      - name: Curriculum contract
        run: uv run --locked practice curriculum check
      - name: Preserved source integrity
        run: uv run --locked practice sources verify
      - name: Unit, integration and end-to-end tests
        timeout-minutes: 35
        run: uv run --locked pytest --junitxml=ci-results/tests.xml
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: ci-results/tests.xml
          if-no-files-found: ignore
          retention-days: 7
